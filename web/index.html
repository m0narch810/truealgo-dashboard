<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrueAlgo Levels</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      background: #0f0f1a;
      border-bottom: 1px solid #1e1e2e;
      padding: 18px 24px 14px;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #7c6fff;
    }

    .snap-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
      font-weight: 600;
    }
    .snap-next  { background: #1a2a1a; color: #4ade80; border: 1px solid #2d4d2d; }
    .snap-same  { background: #1a1a2a; color: #60a5fa; border: 1px solid #2d2d4d; }

    .prices {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .price-item { display: flex; flex-direction: column; }
    .price-label { font-size: 10px; color: #555; letter-spacing: 1px; }
    .price-value { font-size: 18px; font-weight: 600; color: #f0f0f0; }

    .atr-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .atr-pass { background: #0d2010; color: #4ade80; border: 1px solid #1a4020; }
    .atr-fail { background: #200d0d; color: #f87171; border: 1px solid #401a1a; }

    .updated {
      font-size: 11px;
      color: #444;
      margin-top: 8px;
    }
    .updated span { color: #666; }

    /* ── SUMMARY BAR ── */
    .summary {
      display: flex;
      gap: 12px;
      padding: 10px 24px;
      background: #0c0c15;
      border-bottom: 1px solid #1a1a28;
      flex-wrap: wrap;
    }

    .summary-chip {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
    }
    .chip-prec  { background: #0a1f12; color: #34d399; border: 1px solid #1a4028; }
    .chip-vol   { background: #1a1500; color: #fbbf24; border: 1px solid #3a2f00; }
    .chip-none  { background: #1a0a0a; color: #9ca3af; border: 1px solid #2a1a1a; }

    /* ── LEVELS ── */
    .levels { padding: 20px 24px; max-width: 900px; }

    .section-title {
      font-size: 11px;
      letter-spacing: 2px;
      color: #444;
      margin-bottom: 12px;
    }

    .level-card {
      background: #0f0f1a;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 10px;
      transition: border-color 0.2s;
    }
    .level-card:hover { border-color: #3a3a5a; }

    .level-top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qqq-strike {
      font-size: 22px;
      font-weight: 700;
      color: #f0f0f0;
      min-width: 70px;
    }

    .score-badge {
      font-size: 13px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      min-width: 32px;
      text-align: center;
    }
    .score-elite  { background: #0a2010; color: #4ade80; border: 1px solid #1a5030; }
    .score-high   { background: #0d1f10; color: #86efac; border: 1px solid #1e4020; }
    .score-ok     { background: #1a1500; color: #fbbf24; border: 1px solid #3a2f00; }
    .score-low    { background: #141414; color: #6b7280; border: 1px solid #2a2a2a; }

    .dir-chip {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .dir-below { background: #0a1520; color: #60a5fa; border: 1px solid #1a3050; }
    .dir-above { background: #1f0a20; color: #c084fc; border: 1px solid #3f1a50; }

    .dist-text {
      font-size: 12px;
      color: #888;
    }

    .gate-ok   { color: #4ade80; font-size: 13px; }
    .gate-fail { color: #374151; font-size: 13px; }

    .rank-1 { color: #fbbf24; font-size: 11px; font-weight: 700; }

    .signals {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .sig {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 3px;
      background: #161625;
      color: #888;
      border: 1px solid #22223a;
    }
    .sig-key { background: #0d1f18; color: #6ee7b7; border-color: #1a4030; }

    /* ── NO SETUP ── */
    .no-setup {
      padding: 40px 24px;
      text-align: center;
      color: #444;
    }
    .no-setup .icon { font-size: 36px; margin-bottom: 10px; }
    .no-setup p { font-size: 13px; }

    /* ── FOOTER ── */
    .footer {
      padding: 20px 24px;
      border-top: 1px solid #1a1a28;
      color: #333;
      font-size: 11px;
    }

    /* ── LOADING ── */
    .loading {
      padding: 60px 24px;
      text-align: center;
      color: #444;
      font-size: 13px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .header { padding: 14px 16px; }
      .prices { gap: 14px; }
      .price-value { font-size: 16px; }
      .levels { padding: 16px; }
      .qqq-strike { font-size: 18px; }
      .summary { padding: 8px 16px; }
    }
  </style>
</head>
<body>

<div id="app">
  <div class="loading">Loading levels...</div>
</div>

<script>
const REFRESH_MS = 5 * 60 * 1000; // re-fetch JSON every 5 minutes

function scoreClass(s) {
  if (s >= 7) return 'score-elite';
  if (s >= 6) return 'score-high';
  if (s >= 5) return 'score-ok';
  return 'score-low';
}

function sigClass(sig) {
  const key = ['S14', 'S6', 'S12'];
  return key.some(k => sig.startsWith(k)) ? 'sig sig-key' : 'sig';
}

function relativeTime(isoStr) {
  if (!isoStr) return '';
  const then = new Date(isoStr);
  const diffMin = Math.round((Date.now() - then.getTime()) / 60000);
  if (diffMin < 1)  return 'just now';
  if (diffMin < 60) return `${diffMin}m ago`;
  const h = Math.floor(diffMin / 60);
  return `${h}h ${diffMin % 60}m ago`;
}

function render(d) {
  const hasPrecision = d.precision && d.precision.length > 0;
  const hasVolume    = d.volume    && d.volume.length    > 0;
  const snapLabel    = d.snap === 'next_day' ? 'NEXT-DAY' : 'SAME-DAY';
  const snapClass    = d.snap === 'next_day' ? 'snap-next' : 'snap-same';
  const atrLabel     = d.atr_ok
    ? `ATR ${d.atr} &nbsp;&#10003; REGIME OK`
    : `ATR ${d.atr ?? 'N/A'} &nbsp;&#9888; REGIME WEAK`;
  const atrClass     = d.atr_ok ? 'atr-pass' : 'atr-fail';

  // Summary chips
  let summaryHtml = '';
  if (hasPrecision) {
    summaryHtml += `<div class="summary-chip chip-prec">PRECISION: ${d.precision.map(x=>'$'+x).join(', ')}</div>`;
  }
  if (hasVolume) {
    summaryHtml += `<div class="summary-chip chip-vol">VOLUME: ${d.volume.map(x=>'$'+x).join(', ')}</div>`;
  }
  if (!hasPrecision && !hasVolume) {
    summaryHtml = `<div class="summary-chip chip-none">No actionable setups this snapshot</div>`;
  }

  // Level cards
  let levelsHtml = '';
  if (d.levels && d.levels.length > 0) {
    d.levels.forEach(lv => {
      const dirLabel = lv.dir === 'from_below' ? '&uarr; RESISTANCE' : '&darr; SUPPORT';
      const dirClass = lv.dir === 'from_below' ? 'dir-below' : 'dir-above';
      const gateHtml = lv.gate
        ? '<span class="gate-ok">&#10003;</span>'
        : '<span class="gate-fail">&#10005;</span>';
      const rankHtml = lv.rank === 1 ? '<span class="rank-1">&#9733; #1</span>' : '';

      const sigParts = lv.signals && lv.signals !== '--'
        ? lv.signals.split(' ').map(s => `<span class="${sigClass(s)}">${s}</span>`).join('')
        : '<span class="sig" style="color:#333">no signals</span>';

      levelsHtml += `
        <div class="level-card">
          <div class="level-top">
            <div class="qqq-strike">$${lv.qqq}</div>
            <div class="score-badge ${scoreClass(lv.score)}">${lv.score}</div>
            <div class="dir-chip ${dirClass}">${dirLabel}</div>
            <div class="dist-text">${lv.dist > 0 ? '+' : ''}${Math.round(lv.dist)} NQ</div>
            ${gateHtml}
            ${rankHtml}
          </div>
          <div class="signals">${sigParts}</div>
        </div>`;
    });
  } else {
    levelsHtml = `
      <div class="no-setup">
        <div class="icon">&#8722;</div>
        <p>No walls scored above threshold</p>
      </div>`;
  }

  document.getElementById('app').innerHTML = `
    <div class="header">
      <div class="header-top">
        <span class="logo">TRUEALGO</span>
        <span class="snap-badge ${snapClass}">${snapLabel}</span>
      </div>
      <div class="prices">
        <div class="price-item">
          <span class="price-label">NQ</span>
          <span class="price-value">${d.nq.toLocaleString()}</span>
        </div>
        <div class="price-item">
          <span class="price-label">QQQ</span>
          <span class="price-value">$${d.qqq}</span>
        </div>
      </div>
      <div class="atr-chip ${atrClass}">${atrLabel}</div>
      <div class="updated">Last updated <span>${d.updated}</span> &middot; ${relativeTime(d.updated_iso)}</div>
    </div>

    <div class="summary">${summaryHtml}</div>

    <div class="levels">
      <div class="section-title">QQQ GAMMA WALLS &mdash; TOP ${d.levels.length}</div>
      ${levelsHtml}
    </div>

    <div class="footer">
      Score 5+ ATR-gated ~65% hist &nbsp;|&nbsp; Score 6+ ATR-gated ~73% hist &nbsp;|&nbsp; Score 7+ ~69% hist
      &nbsp;&nbsp;&middot;&nbsp;&nbsp; Green = precision &nbsp;|&nbsp; Yellow = volume &nbsp;|&nbsp; Arrows = direction vs current NQ
    </div>`;
}

function renderError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="no-setup" style="padding:80px 24px">
      <div class="icon" style="color:#f87171">!</div>
      <p style="color:#888; margin-top:8px">${msg}</p>
    </div>`;
}

async function load() {
  try {
    const r = await fetch(`levels.json?t=${Date.now()}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    render(d);
  } catch (e) {
    renderError(`Could not load levels.json &mdash; ${e.message}`);
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
