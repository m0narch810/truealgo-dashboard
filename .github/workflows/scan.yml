name: TrueAlgo Scan

on:
  schedule:
    # Every 30 min, Mon-Fri, 9:00-15:30 ET (UTC-4 in summer)
    # :05 and :35 past the hour so data settles after the half-hour mark
    # 13:05-19:35 UTC covers 9:05-15:35 ET
    - cron: '5,35 13-19 * * 1-5'
  workflow_dispatch:  # allow manual trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas yfinance pytz

      - name: Run TrueAlgo scan
        env:
          FF_SESSION: ${{ secrets.FF_SESSION }}
        run: python truealgo_live.py --json-out web/levels.json

      - name: Commit updated levels
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "scan: update levels.json"
          file_pattern: web/levels.json
          commit_user_name: TrueAlgo Bot
          commit_user_email: bot@truealgo.local
